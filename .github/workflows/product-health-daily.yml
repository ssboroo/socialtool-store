name: Daily product health
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Call authenticated product health scan
        env:
          CRON_URL: ${{ secrets.SOCIALTOOL_HEALTH_CRON_URL }}
          CRON_SECRET: ${{ secrets.SOCIALTOOL_HEALTH_CRON_SECRET }}
        run: |
          if [ -z "$CRON_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::notice::Set SOCIALTOOL_HEALTH_CRON_URL and SOCIALTOOL_HEALTH_CRON_SECRET to enable the daily scan."
            exit 0
          fi
          curl --fail --show-error --silent --max-time 45 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$CRON_URL"
