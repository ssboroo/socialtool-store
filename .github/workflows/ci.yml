name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: file:/tmp/socialtool-ci.db
      TEST_DATABASE_URL: file:/tmp/socialtool-ci.db
      JWT_SECRET: ci_only_secret_at_least_32_characters_long_123456
      ADMIN_USERNAME: ci-admin
      ADMIN_PASSWORD: ci-admin-password-not-for-production
      WIRE_MN_API_KEY: sk_test_local_mock_only
      WIRE_MN_WEBHOOK_SECRET: whsec_local_test_only
      WIRE_MN_ALLOWED_OPERATORS: sandbox
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3217
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ignore committed environment during CI
        run: rm -f .env

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Prepare isolated database
        run: bunx prisma db push

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build

      - name: Unit tests
        run: node --experimental-strip-types --test tests/media.test.mjs tests/wire-requests.test.mjs tests/wire-signature.test.mjs

      - name: Integration test
        run: node --experimental-strip-types --test tests/integration.test.mjs
